name = "watermelon-mcp"
main = "./mcp/worker.ts"
compatibility_date = "2026-09-04"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[[analytics_engine_datasets]]
binding = "MCP_ANALYTICS"
dataset = "watermelon_mcp_events"

[[routes]]
pattern = "mcp.watermelon.sh"
zone_name = "watermelon.sh"
custom_domain = true
