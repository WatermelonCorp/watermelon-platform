name: Deploy Platform Worker

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'worker/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'wrangler.toml'
      - '.github/workflows/deploy-platform.yml'
  # Dashboards and blocks under /r come from watermellon-registry at build
  # time, so redeploy daily to publish registry changes merged there.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Merging several PRs in a row starts several deploys at once, and the last
# one to finish wins, even if it deploys an older commit (seen 2026-09-30:
# #227's build overwrote #226 and #220). Run deploys one at a time, in order.
concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the sitemap's <lastmod> comes from each file's real
          # last commit, not the shallow clone's single commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Analytics keys are baked into the bundle at build time. They are public
      # (every visitor's browser gets them), so they live in repo variables.
      - name: Build platform
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_SITE_URL: https://ui.watermelon.sh
        run: bun run build

      - name: Check analytics keys are in the build
        run: bun run scripts/check-analytics-build.ts

      - name: Deploy platform worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config wrangler.toml

      # Tell Bing and other IndexNow engines about changed URLs. Only on code
      # pushes, not the daily registry redeploy, and never fail the deploy.
      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: bun run scripts/indexnow.ts
